name: 24/7 NBA 2K26 Cloud Keep-Alive & Health Check

on:
  push:
    branches: [ main ]
  schedule:
    # Her 15 dakikada bir bulut sunucusunu uyanık tutar
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  cloud-keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Live 1xBet Feed Connectivity from Cloud
        run: |
          python -c "
          import run_live_auto_scraper
          games = run_live_auto_scraper.fetch_all_live_games_via_api()
          print('Cloud LiveFeed reachable! Active games count:', len(games) if games else 0)
          if games:
              for g in games:
                  print(' ->', g.get('team_1'), 'vs', g.get('team_2'), '| Score:', g.get('score_1'), '-', g.get('score_2'), '| Barems:', len(g.get('barems', [])))
          "
